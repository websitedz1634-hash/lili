<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>lilya_brannd</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800&family=Playfair+Display:ital,wght@0,500;0,700;1,500&display=swap" rel="stylesheet">
<style>
  :root{
    --pink:#f7e3ea;
    --pink-deep:#e7b9c8;
    --rose:#c98a9c;
    --ink:#3b3536;
    --cream:#fbf6f0;
    --gold:#e9d3a3;
    --white:#ffffff;
    --line: rgba(59,53,54,.15);
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    font-family:'Cairo',sans-serif;
    background:var(--cream);
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
  }
  [lang-fr] body, body.fr{font-family:'Cairo',sans-serif;}
  h1,h2,h3,.brand-word{font-family:'Playfair Display',serif;}
  a{color:inherit;text-decoration:none;}
  img{max-width:100%;display:block;}

  /* ---------- announcement bar ---------- */
  .announce{
    background:var(--ink);color:#f3e9ec;font-size:13px;font-weight:600;
    text-align:center;padding:9px 16px;letter-spacing:.2px;
  }
  .announce span{opacity:.55;margin:0 10px;}

  /* ---------- top bar ---------- */
  header{
    position:sticky;top:0;z-index:50;
    background:var(--cream);
    border-bottom:1px solid var(--line);
  }
  .topbar{
    max-width:1180px;margin:0 auto;
    display:flex;align-items:center;justify-content:space-between;
    padding:14px 20px;gap:14px;
  }
  .logo{font-size:28px;font-weight:700;letter-spacing:.5px;color:var(--ink);}
  .logo span{color:var(--rose);font-style:italic;font-family:'Playfair Display',serif;font-weight:500;}
  .logo-link{display:flex;align-items:center;}
  .header-logo-img{height:42px;width:auto;display:block;}
  .hero-visual{overflow:hidden;}
  .hero-logo-img{width:70%;max-width:320px;height:auto;object-fit:contain;filter:drop-shadow(0 10px 20px rgba(59,53,54,.12));}
  nav.main-nav{display:flex;gap:26px;font-weight:600;font-size:15px;}
  nav.main-nav a{padding:6px 2px;border-bottom:2px solid transparent;transition:.2s;}
  nav.main-nav a:hover, nav.main-nav a.active{border-color:var(--rose);color:var(--rose);}
  .top-icons{display:flex;align-items:center;gap:16px;}
  .icon-btn{
    background:none;border:none;cursor:pointer;position:relative;
    display:flex;align-items:center;justify-content:center;
    width:38px;height:38px;border-radius:50%;
    transition:.2s;color:var(--ink);
  }
  .icon-btn:hover{background:var(--pink);}
  .icon-btn svg{width:20px;height:20px;}
  .badge{
    position:absolute;top:-2px;inset-inline-end:-2px;
    background:var(--rose);color:#fff;font-size:10px;font-weight:700;
    width:16px;height:16px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
  }
  .lang-switch{
    display:flex;border:1px solid var(--line);border-radius:20px;overflow:hidden;font-size:12px;font-weight:700;
  }
  .lang-switch button{border:none;background:none;padding:6px 12px;cursor:pointer;color:var(--ink);}
  .lang-switch button.active{background:var(--rose);color:#fff;}
  .mobile-toggle{display:none;background:none;border:none;cursor:pointer;}

  /* ---------- hero ---------- */
  .hero-shell{background:linear-gradient(180deg,#fdf9f5 0%,var(--cream) 100%);border-bottom:1px solid var(--line);}
  .hero{
    max-width:1180px;margin:0 auto;
    display:grid;grid-template-columns:1.05fr .95fr;gap:56px;
    padding:64px 20px 70px;align-items:center;
  }
  .eyebrow{
    display:inline-flex;align-items:center;gap:8px;
    font-size:13px;font-weight:700;color:var(--rose);
    margin-bottom:18px;
  }
  .eyebrow::before{content:"";width:22px;height:1.5px;background:var(--rose);display:inline-block;}
  .hero h1{font-size:54px;line-height:1.18;margin:0 0 20px;font-weight:700;}
  .hero h1 em{font-style:italic;color:var(--rose);}
  .hero p.lede{font-size:17px;line-height:1.85;color:#635a5b;max-width:44ch;margin:0 0 32px;}
  .hero-actions{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:40px;}
  .btn{
    display:inline-flex;align-items:center;gap:8px;
    padding:15px 28px;border-radius:7px;font-weight:700;font-size:15px;
    cursor:pointer;border:none;transition:.2s;
  }
  .btn-primary{background:var(--ink);color:#fff;}
  .btn-primary:hover{background:var(--rose);transform:translateY(-1px);}
  .btn-outline{background:transparent;border:1.5px solid var(--ink);color:var(--ink);}
  .btn-outline:hover{border-color:var(--rose);color:var(--rose);}
  .hero-stats{display:flex;gap:36px;flex-wrap:wrap;}
  .hero-stats div{display:flex;flex-direction:column;}
  .hero-stats b{font-family:'Playfair Display',serif;font-size:26px;font-weight:700;}
  .hero-stats span{font-size:12.5px;color:#8a8081;margin-top:3px;}
  .hero-stats div:not(:last-child){padding-inline-end:36px;border-inline-end:1px solid var(--line);}

  .hero-visual{
    aspect-ratio:4/5;border-radius:18px;overflow:hidden;
    background:linear-gradient(155deg,var(--pink) 0%,var(--gold) 100%);
    display:flex;align-items:center;justify-content:center;
    position:relative;box-shadow:0 30px 60px -20px rgba(59,53,54,.25);
  }
  .hero-visual::before{
    content:"";position:absolute;inset:14px;border:1px solid rgba(59,53,54,.14);border-radius:12px;pointer-events:none;
  }
  .hero-visual .brand-word{font-size:70px;color:rgba(59,53,54,.18);font-weight:700;}
  .hero-visual-card{
    position:absolute;bottom:22px;inset-inline-start:22px;
    background:rgba(255,255,255,.92);backdrop-filter:blur(4px);
    border-radius:10px;padding:12px 16px;display:flex;align-items:center;gap:10px;
    box-shadow:0 10px 24px rgba(59,53,54,.12);
  }
  .hero-visual-card .dot{width:9px;height:9px;border-radius:50%;background:var(--rose);flex-shrink:0;}
  .hero-visual-card span{font-size:12.5px;font-weight:700;}

  /* ---------- features ---------- */
  .features{
    max-width:1180px;margin:0 auto;padding:56px 20px 10px;
    display:grid;grid-template-columns:repeat(4,1fr);gap:20px;
  }
  .feature{
    background:#fff;border:1px solid var(--line);border-radius:12px;padding:22px 20px;
    display:flex;flex-direction:column;gap:10px;transition:.2s;
  }
  .feature:hover{border-color:var(--rose);transform:translateY(-2px);}
  .feature .fic{
    width:42px;height:42px;border-radius:10px;background:var(--pink);
    display:flex;align-items:center;justify-content:center;color:var(--rose);
  }
  .feature .fic svg{width:20px;height:20px;}
  .feature h4{margin:0;font-size:15px;}
  .feature p{margin:0;font-size:13px;color:#8a8081;line-height:1.6;}
  @media(max-width:880px){
    .features{grid-template-columns:1fr 1fr;}
  }
  @media(max-width:560px){
    .features{grid-template-columns:1fr;}
    .hero-stats div:not(:last-child){padding-inline-end:20px;margin-inline-end:0;}
  }

  /* ---------- section shells ---------- */
  section{max-width:1180px;margin:0 auto;padding:60px 20px;}
  .section-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:30px;gap:20px;flex-wrap:wrap;}
  .section-head h2{font-size:32px;margin:0;}
  .section-head p{margin:6px 0 0;color:#786f70;font-size:14px;}

  /* ---------- categories ---------- */
  .cat-row{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:34px;}
  .cat-chip{
    padding:10px 22px;border-radius:30px;border:1.5px solid var(--line);
    font-weight:700;font-size:14px;cursor:pointer;background:#fff;transition:.2s;
  }
  .cat-chip.active,.cat-chip:hover{background:var(--ink);color:#fff;border-color:var(--ink);}

  /* ---------- product grid ---------- */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:24px;}
  .card{
    background:#fff;border-radius:12px;overflow:hidden;border:1px solid var(--line);
    display:flex;flex-direction:column;transition:.25s;
  }
  .card:hover{box-shadow:0 14px 30px rgba(59,53,54,.09);transform:translateY(-3px);}
  .card .thumb{
    aspect-ratio:3/4;background:var(--pink);display:flex;align-items:center;justify-content:center;
    overflow:hidden;position:relative;
  }
  .card .thumb img{width:100%;height:100%;object-fit:cover;}
  .card .thumb .ph{color:var(--rose);font-size:13px;font-weight:700;}
  .promo-tag{
    position:absolute;top:10px;inset-inline-start:10px;background:var(--rose);color:#fff;
    font-size:11px;font-weight:800;padding:4px 10px;border-radius:20px;
  }
  .card .info{padding:16px;display:flex;flex-direction:column;gap:6px;flex:1;}
  .card .cat{font-size:11px;font-weight:700;color:var(--rose);letter-spacing:.3px;}
  .card h3{margin:0;font-size:17px;font-weight:700;font-family:'Cairo',sans-serif;}
  .card .desc{font-size:13px;color:#786f70;line-height:1.6;flex:1;}
  .price-row{display:flex;align-items:baseline;gap:8px;margin-top:4px;}
  .price{font-weight:800;font-size:16px;}
  .old-price{font-size:13px;color:#a49b9c;text-decoration:line-through;}
  .card-actions{display:flex;gap:8px;margin-top:10px;}
  .buy-now{
    flex:1;background:var(--ink);color:#fff;border:none;border-radius:6px;
    padding:11px 10px;font-weight:700;font-size:13.5px;cursor:pointer;transition:.2s;
  }
  .buy-now:hover{background:var(--rose);}
  .add-cart{
    border:1.5px solid var(--line);background:#fff;border-radius:6px;width:42px;
    display:flex;align-items:center;justify-content:center;cursor:pointer;transition:.2s;
  }
  .add-cart:hover{border-color:var(--rose);color:var(--rose);}
  .add-cart svg{width:17px;height:17px;}
  .empty-note{color:#8a8081;font-size:14px;padding:20px 0;}
  .swatch-row{display:flex;gap:6px;margin-top:2px;}
  .swatch-row .sw{width:16px;height:16px;border-radius:50%;border:1px solid rgba(0,0,0,.15);display:inline-block;}
  .stock-badge{margin-inline-start:6px;font-size:11px;font-weight:800;padding:3px 9px;border-radius:20px;}
  .stock-badge.no{background:#fbebeb;color:#c65b5b;}
  .buy-now:disabled, .add-cart:disabled{opacity:.5;cursor:not-allowed;}
  .buy-now:disabled:hover{background:var(--ink);}

  /* ---------- promo banner ---------- */
  .promo-banner{
    background:linear-gradient(120deg,var(--ink) 0%,#54494b 100%);color:#fff;
    border-radius:14px;padding:40px;display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap;
  }
  .promo-banner h2{color:#fff;margin:0 0 6px;font-size:26px;}
  .promo-banner p{margin:0;color:#e9dfe0;font-size:14px;}

  /* ---------- contact page ---------- */
  .contact-grid{display:grid;grid-template-columns:1fr 1fr;gap:30px;}
  .contact-card{
    background:#fff;border:1px solid var(--line);border-radius:12px;padding:24px;
    display:flex;align-items:center;gap:16px;transition:.2s;
  }
  .contact-card:hover{border-color:var(--rose);}
  .contact-card .ic{
    width:48px;height:48px;border-radius:50%;background:var(--pink);
    display:flex;align-items:center;justify-content:center;flex-shrink:0;
  }
  .contact-card .ic svg{width:22px;height:22px;color:var(--rose);}
  .contact-card h4{margin:0 0 4px;font-size:16px;}
  .contact-card span{font-size:13px;color:#786f70;}

  /* ---------- footer ---------- */
  footer{border-top:1px solid var(--line);padding:30px 20px;text-align:center;color:#8a8081;font-size:13px;}

  /* ---------- drawers / modals ---------- */
  .overlay{
    position:fixed;inset:0;background:rgba(30,26,27,.45);z-index:100;
    display:none;align-items:stretch;justify-content:flex-end;
  }
  .overlay.open{display:flex;}
  html[dir="rtl"] .overlay{justify-content:flex-start;}
  .drawer{
    background:#fff;width:min(420px,92vw);height:100%;padding:26px;overflow-y:auto;
    animation:slidein .25s ease;
  }
  @keyframes slidein{from{transform:translateX(20px);opacity:0}to{transform:translateX(0);opacity:1}}
  .drawer-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;}
  .drawer-head h3{margin:0;font-size:20px;}
  .close-x{background:none;border:none;font-size:22px;cursor:pointer;color:var(--ink);}
  .cart-line{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);align-items:center;}
  .cart-line .tt{flex:1;}
  .cart-line .tt h5{margin:0 0 4px;font-size:14px;}
  .cart-line .tt small{color:#786f70;}
  .qty-x{background:var(--pink);border:none;border-radius:5px;padding:4px 8px;font-weight:700;cursor:pointer;}

  form.order-form{display:flex;flex-direction:column;gap:12px;}
  form.order-form label{font-size:13px;font-weight:700;margin-bottom:-6px;}
  form.order-form input,form.order-form select,form.order-form textarea{
    border:1.5px solid var(--line);border-radius:7px;padding:11px 12px;font-family:inherit;font-size:14px;background:#fff;
  }
  form.order-form input:focus,form.order-form select:focus,form.order-form textarea:focus{outline:none;border-color:var(--rose);}
  .price-breakdown{background:var(--pink);border-radius:8px;padding:14px;font-size:13.5px;line-height:2;}
  .price-breakdown b{font-size:16px;}

  .search-box{display:flex;gap:8px;margin-bottom:6px;}
  .search-box input{flex:1;border:1.5px solid var(--line);border-radius:7px;padding:11px 12px;font-family:inherit;}
  .search-results{display:flex;flex-direction:column;gap:10px;margin-top:16px;}
  .sr-item{display:flex;gap:12px;align-items:center;padding:8px;border-radius:8px;cursor:pointer;}
  .sr-item:hover{background:var(--pink);}
  .sr-item .th{width:52px;height:66px;border-radius:6px;overflow:hidden;background:var(--pink);flex-shrink:0;}
  .sr-item .th img{width:100%;height:100%;object-fit:cover;}

  @media(max-width:880px){
    .hero{grid-template-columns:1fr;padding-top:30px;}
    .hero h1{font-size:38px;}
    nav.main-nav{
      position:fixed;top:64px;inset-inline-start:0;background:#fff;width:100%;
      flex-direction:column;padding:16px 24px;gap:2px;border-bottom:1px solid var(--line);
      display:none;
    }
    nav.main-nav.open{display:flex;}
    nav.main-nav a{padding:12px 0;border-bottom:1px solid var(--line);}
    .mobile-toggle{display:block;}
    .contact-grid{grid-template-columns:1fr;}
  }
</style>
</head>
